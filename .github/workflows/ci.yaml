name: CI

on:
  push:
    branches: [dev, beta]
  pull_request:
    branches: [prod]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tutorops
          POSTGRES_PASSWORD: tutorops
          POSTGRES_DB: tutorops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB_USER: tutorops
      POSTGRES_DB_PASSWORD: tutorops
      POSTGRES_DB_HOST: localhost
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_NAME: tutorops_test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: |
          for file in migrations/*.sql; do
            psql -h localhost -U tutorops -d tutorops_test -v ON_ERROR_STOP=1 -f "$file"
          done
        env:
          PGPASSWORD: tutorops

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build